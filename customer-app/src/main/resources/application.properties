server.port=8083
vlad.services.catalogue.uri=${CATALOGUE_URI:http://localhost:8081}

spring.config.import=optional:file:./.env[.properties],optional:file:./../.env[.properties]

spring.datasource.url=${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5434/customer_app}
spring.datasource.username=${CUSTOMER_DB_USERNAME:customer_app}
spring.datasource.password=${CUSTOMER_DB_PASSWORD:customer_app}

spring.flyway.schemas=public,customer_app

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/RecipeManagementSystem}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CUSTOMER_CLIENT_ID:customer-app}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CUSTOMER_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.scope=openid,view_catalogue,microprofile-jwt

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.max-http-request-header-size=8KB
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-form-post-size=1MB
