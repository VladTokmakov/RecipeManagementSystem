<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ничего не найдено &ndash; Рецептотека</title>
    <link rel="stylesheet" data-th-href="@{/styles.css}">
</head>
<body>
<nav class="navbar">
    <div class="nav-links">
        <a data-th-href="@{/customer/products/list}">Рецепты</a>
        <a data-th-href="@{/customer/products/favourites}">Избранное</a>
        <form method="post" data-th-action="@{/logout}" style="display: inline;">
            <button type="submit" class="nav-logout">Выйти</button>
        </form>
    </div>
</nav>

<div class="main-content recipe-detail-container">
    <a data-th-href="@{/customer/products/list}" class="back-link">&larr; К списку рецептов</a>
    <div class="recipe-detail-header">
        <h1 class="recipe-detail-title">Ошибка 404: ничего не нашлось</h1>
        <p class="recipe-detail-description">
            Такого рецепта нет — возможно, он был удалён или ссылка устарела.
        </p>
        <p class="recipe-detail-description" data-th-if="${error != null}" data-th-text="${error}"></p>
    </div>
</div>
</body>
</html>
