<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title data-th-text="${errorTitle}">Ошибка</title>
    <link rel="stylesheet" data-th-href="@{/styles.css}">
</head>
<body>
<nav class="navbar">
    <div class="nav-links">
        <a data-th-href="@{/customer/products/list}">Рецепты</a>
        <a data-th-href="@{/customer/products/favourites}">Избранное</a>
        <form method="post" data-th-action="@{/logout}" style="display: inline;">
            <button type="submit" class="nav-logout">Выйти</button>
        </form>
    </div>
</nav>

<div class="main-content recipe-detail-container">
    <a data-th-href="@{/customer/products/list}" class="back-link">&larr; К списку рецептов</a>
    <div class="recipe-detail-header">
        <h1 class="recipe-detail-title" data-th-text="${errorHeader}">Некорректный запрос</h1>
    </div>
    <ul data-th-if="${!errors.isEmpty()}">
        <li data-th-each="error : ${errors}" data-th-text="${error}"></li>
    </ul>
</div>
</body>
</html>
