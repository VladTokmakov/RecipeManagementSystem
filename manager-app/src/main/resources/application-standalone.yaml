vlad:
    security:
        rate-limit:
            requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
            trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED:false}
    services:
        catalogue:
            uri: ${CATALOGUE_URI:http://localhost:8081}
            registration-id: ${CATALOGUE_REGISTRATION_ID:keycloak}
spring:
    config:
        import:
            - optional:file:./.env[.properties]
            - optional:file:./../.env[.properties]
    security:
        oauth2:
            client:
                provider:
                    keycloak:
                        issuer-uri: ${KEYCLOAK_ISSUER_URI:https://localhost/auth/realms/RecipeManagementSystem}
                        user-name-attribute: sub
                registration:
                    keycloak:
                        client-id: ${KEYCLOAK_MANAGER_CLIENT_ID:manager-app}
                        client-secret: ${KEYCLOAK_MANAGER_CLIENT_SECRET}
                        redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
                        scope:
                            - openid
                            - view_catalogue
                            - edit_catalogue
                            - microprofile-jwt
    jpa:
        open-in-view: false
server:
    address: 127.0.0.1
    port: 8080
    forward-headers-strategy: native
    max-http-request-header-size: 8KB
    servlet:
        context-path: /manager
        session:
            timeout: 30m
            cookie:
                http-only: true
                same-site: lax
                secure: ${COOKIE_SECURE:false}
    error:
        include-message: never
        include-stacktrace: never
        include-exception: false
    tomcat:
        max-swallow-size: 2MB
        max-http-form-post-size: 1MB
logging:
    level:
        root: info
