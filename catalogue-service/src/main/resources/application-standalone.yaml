spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./../.env[.properties]
  datasource:
    url: ${CATALOGUE_DB_URL:jdbc:postgresql://localhost:5432/catalogue}
    username: ${CATALOGUE_DB_USERNAME:catalogue}
    password: ${CATALOGUE_DB_PASSWORD:catalogue}
  flyway:
    schemas:
      - public
      - catalogue
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://localhost/auth/realms/RecipeManagementSystem}
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:https://localhost/auth/realms/RecipeManagementSystem}
            user-name-attribute: sub
        registration:
          keycloak-swagger:
            provider: keycloak
            client-id: ${SWAGGER_CLIENT_ID:swagger-ui}
            client-secret: ${SWAGGER_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/catalogue-auth/login/oauth2/code/{registrationId}"

vlad:
  security:
    audience: ${CATALOGUE_AUDIENCE:catalogue-service}
    rate-limit:
      requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
      trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED:false}
  swagger:
    auth-url: ${SWAGGER_AUTH_URL:https://localhost/auth/realms/RecipeManagementSystem/protocol/openid-connect/auth}
    token-url: ${SWAGGER_TOKEN_URL:https://localhost/auth/realms/RecipeManagementSystem/protocol/openid-connect/token}

server:
  address: 127.0.0.1
  port: 8081
  forward-headers-strategy: native
  max-http-request-header-size: 8KB
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CATALOGUE_SESSION
        path: /
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 1MB

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

logging:
  level:
    root: info
    sql: warn
