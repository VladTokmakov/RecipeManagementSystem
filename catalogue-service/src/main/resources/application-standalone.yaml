spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./../.env[.properties]
  datasource:
    url: ${CATALOGUE_DB_URL:jdbc:postgresql://localhost:5432/catalogue}
    username: ${CATALOGUE_DB_USERNAME:catalogue}
    password: ${CATALOGUE_DB_PASSWORD:catalogue}
  flyway:
    schemas:
      - public
      - catalogue
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://localhost/auth/realms/RecipeManagementSystem}

vlad:
  security:
    audience: ${CATALOGUE_AUDIENCE:catalogue-service}
    rate-limit:
      requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
      trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED:false}

server:
  address: 127.0.0.1
  port: 8081
  forward-headers-strategy: native
  max-http-request-header-size: 8KB
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 1MB

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

logging:
  level:
    root: info
    sql: warn
