worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request_method $uri $status '
                    '$body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    server_tokens off;
    client_max_body_size 2m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream customer_app {
        server host.docker.internal:8083;
        keepalive 16;
    }

    upstream manager_app {
        server host.docker.internal:8080;
        keepalive 16;
    }

    upstream catalogue_api {
        server host.docker.internal:8081;
        keepalive 16;
    }

    upstream keycloak {
        server keycloak:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /catalogue-api/ {
            proxy_pass http://catalogue_api;
        }

        location ~ ^/(swagger-ui|v3/api-docs) {
            proxy_pass http://catalogue_api;
        }

        location /auth/ {
            proxy_pass http://keycloak;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }

        location = /manager {
            return 301 https://$host/manager/;
        }

        location /manager/ {
            proxy_pass http://manager_app;
        }

        location = / {
            proxy_pass http://customer_app;
        }

        location / {
            proxy_pass http://customer_app;
        }
    }
}
